# Supabase CLI configuration for local development (`supabase start`, `supabase db reset`, `supabase test db`).
project_id = "powermac-connect"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/auth/callback", "http://localhost:3100/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = true
